<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sorpresa U2 Mejorada</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #fff9f0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #box {
    width: 150px;
    cursor: pointer;
    transition: transform 0.3s ease;
    position: relative;
  }
  #box.exploding {
    animation: explode 0.6s forwards;
  }
  @keyframes explode {
    0% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.5) rotate(45deg); opacity: 0.7; }
    100% { transform: scale(0) rotate(360deg); opacity: 0; }
  }
  #message {
    margin-top: 20px;
    font-size: 2em;
    color: #e74c3c;
    font-weight: bold;
    display: none;
    animation: moveAndScale 3s ease-in-out infinite alternate;
    position: relative;
  }
  @keyframes moveAndScale {
    0% { transform: translateX(0) scale(1); }
    50% { transform: translateX(200px) scale(1.5); }
    100% { transform: translateX(0) scale(1); }
  }
  canvas {
    position: fixed;
    pointer-events: none;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
  }
  #kittens {
    margin-top: 30px;
    display: flex;
    gap: 15px;
    display: none;
  }
  .kitten {
    width: 80px;
    animation: dance 1s ease-in-out infinite alternate;
  }
  .kitten:nth-child(odd) {
    animation-delay: 0s;
  }
  .kitten:nth-child(even) {
    animation-delay: 0.5s;
  }
  @keyframes dance {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(10deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
</style>
</head>
<body>

<img id="box" src="https://cdn-icons-png.flaticon.com/512/748/748113.png" alt="Caja sorpresa" title="Clica aquí para la sorpresa" />
<div id="message">Get ready for U2 in BCN!</div>
<div id="kittens">
  <img class="kitten" src="https://cdn2.thecatapi.com/images/MTY3ODIyMQ.jpg" alt="Kitten 1" />
  <img class="kitten" src="https://cdn2.thecatapi.com/images/MTY3ODIyOQ.jpg" alt="Kitten 2" />
  <img class="kitten" src="https://cdn2.thecatapi.com/images/MTY3ODIyMQ.jpg" alt="Kitten 3" />
</div>
<canvas id="confetti"></canvas>

<script>
const box = document.getElementById('box');
const message = document.getElementById('message');
const kittens = document.getElementById('kittens');
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confettiActive = false;
const confettiCount = 150;
const confetti = [];

function randomRange(min, max) {
  return Math.random() * (max - min) + min;
}

function Confetto() {
  this.x = randomRange(0, canvas.width);
  this.y = randomRange(-canvas.height, 0);
  this.radius = randomRange(5, 10);
  this.color = `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`;
  this.speed = randomRange(2, 5);
  this.tilt = randomRange(-10, 10);
  this.tiltAngle = 0;
  this.tiltSpeed = randomRange(0.05, 0.1);
}

Confetto.prototype.update = function() {
  this.y += this.speed;
  this.tiltAngle += this.tiltSpeed;
  this.tilt = Math.sin(this.tiltAngle) * 10;

  if (this.y > canvas.height) {
    this.y = -10;
    this.x = randomRange(0, canvas.width);
  }
};

Confetto.prototype.draw = function() {
  ctx.beginPath();
  ctx.lineWidth = 5;
  ctx.strokeStyle = this.color;
  ctx.moveTo(this.x + this.tilt + this.radius / 2, this.y);
  ctx.lineTo(this.x + this.tilt, this.y + this.tilt + this.radius / 2);
  ctx.stroke();
};

function createConfetti() {
  for(let i = 0; i < confettiCount; i++) {
    confetti.push(new Confetto());
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confetti.forEach(c => {
    c.update();
    c.draw();
  });
  if (confettiActive) {
    requestAnimationFrame(draw);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

box.addEventListener('click', () => {
  if (confettiActive) return;
  confettiActive = true;

  // Animar caja explotando
  box.classList.add('exploding');

  // Mostrar mensaje animado y gatitos tras la explosión
  setTimeout(() => {
    box.style.display = 'none';
    message.style.display = 'block';
    kittens.style.display = 'flex';
    createConfetti();
    draw();
  }, 600);
});

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
